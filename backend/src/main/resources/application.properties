spring.application.name=DTDemoProject

# --- identita uzla (v Dockeri sa nastavuje cez env premenne, rovnaky obraz na vsetkych uzloch) ---
config.code=${NODE_ID:A}
config.role=${NODE_ROLE:POINT}
config.peers=${PEERS:http://localhost:8082,http://localhost:8083}
config.sync-token=${SYNC_TOKEN}
config.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5234}

# --- databaza ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:8000/dt_a}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- scheduler: worker (outbox) a monitor peerov bezia paralelne ---
spring.task.scheduling.pool.size=2

# --- health checks (Docker healthcheck vola /actuator/health) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
server.shutdown=graceful

# --- logy: kod uzla v kazdom riadku (centralizovane logovanie cez Loki) ---
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [node-${config.code}] %logger{30} : %m%n
